[package]
name = "structurizr-lsp"
version = "0.1.1"
edition = "2021"

[features]
# `stdio` pulls in tokio + tower-lsp-server to serve the language server over
# stdin/stdout. It is left off for wasm32 builds, where only the
# runtime-agnostic `Core` and the `jsonrpc` dispatcher are compiled.
default = ["stdio"]
stdio = ["dep:tokio", "dep:tower-lsp-server", "dep:anyhow"]

[dependencies]
structurizr-model = { path = "../structurizr-model" }
structurizr-dsl = { path = "../structurizr-dsl" }
ls-types = "0.0.6"
serde = "1"
serde_json = "1"
anyhow = { version = "1", optional = true }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-std",
], optional = true }
tower-lsp-server = { version = "0.23.0", optional = true }
