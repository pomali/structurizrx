[package]
name = "structurizr-lsp-wasm"
version = "0.1.1"
edition = "2021"
description = "WebAssembly build of the Structurizr DSL language server"

[lib]
# cdylib → WASM module loaded by wasm-bindgen
# rlib   → native Rust library, so the tests below run on the host
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` drops tokio + tower-lsp-server, neither of which
# builds for wasm32-unknown-unknown. Only the synchronous dispatcher is used.
structurizr-lsp = { path = "../structurizr-lsp", default-features = false }
serde_json = "1"
wasm-bindgen = "=0.2.118"
