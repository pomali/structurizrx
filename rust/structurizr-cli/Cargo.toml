[package]
name = "structurizr-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "structurizrx"
path = "src/main.rs"

[dependencies]
structurizr-model = { path = "../structurizr-model" }
structurizr-dsl = { path = "../structurizr-dsl" }
structurizr-renderer = { path = "../structurizr-renderer", features = ["png"] }
structurizr-query = { path = "../structurizr-query" }
structurizr-web = { path = "../structurizr-web" }
structurizr-lsp = { path = "../structurizr-lsp" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
base64 = "0.22.1"
tokio = { version = "1", features = ["full"] }
