# nfpm config for building .deb and .rpm packages from a prebuilt binary.
# Driven by the release workflow, which sets VERSION and ARCH in the
# environment and has already copied the binary to package/structurizrx before
# running `nfpm package --packager deb|rpm`. nfpm expands environment variables
# in fields like `version` and `arch`, but not in `contents[].src` — there a
# `${BIN}` stays literal and the build fails with "glob failed".
# https://nfpm.goreleaser.com/
name: structurizrx
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: "pomali <structurizrx@users.noreply.github.com>"
description: |
  Structurizr DSL toolchain - Rust implementation.
  Parse, validate, render, and serve C4 architecture models.
vendor: pomali
homepage: https://github.com/pomali/structurizrx
license: Apache-2.0
contents:
  - src: ./package/structurizrx
    dst: /usr/bin/structurizrx
    file_info:
      mode: 0755
