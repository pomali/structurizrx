name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: structurizrx-aarch64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: structurizrx-x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: structurizrx-x86_64-unknown-linux-gnu
            archive: tar.gz
            nfpm_arch: amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: structurizrx-x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: structurizrx-aarch64-unknown-linux-gnu
            archive: tar.gz
            nfpm_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: structurizrx-x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }} --bin structurizrx

      - name: Package binary (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp rust/target/${{ matrix.target }}/release/structurizrx package/structurizrx
          tar czf ${{ matrix.artifact_name }}.${{ matrix.archive }} -C package structurizrx

      - name: Package binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "rust/target/${{ matrix.target }}/release/structurizrx.exe" "package/structurizrx.exe"
          Compress-Archive -Path "package/structurizrx.exe" -DestinationPath "${{ matrix.artifact_name }}.${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive }}

      - name: Build .deb and .rpm packages
        if: matrix.nfpm_arch != ''
        env:
          ARCH: ${{ matrix.nfpm_arch }}
          BIN: rust/target/${{ matrix.target }}/release/structurizrx
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          NFPM="$(go env GOPATH)/bin/nfpm"
          mkdir -p dist
          "$NFPM" package --config packaging/nfpm.yaml --packager deb --target dist/
          "$NFPM" package --config packaging/nfpm.yaml --packager rpm --target dist/
          ls -l dist/

      - name: Upload Linux packages
        if: matrix.nfpm_arch != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-linux-packages
          path: dist/*

  release:
    name: Create Release & Update Formula
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256 checksums
        id: checksums
        run: |
          sha() { sha256sum "$1" | awk '{print $1}'; }
          A="artifacts"
          echo "arm=$(sha $A/structurizrx-aarch64-apple-darwin/structurizrx-aarch64-apple-darwin.tar.gz)" >> $GITHUB_OUTPUT
          echo "x86=$(sha $A/structurizrx-x86_64-apple-darwin/structurizrx-x86_64-apple-darwin.tar.gz)" >> $GITHUB_OUTPUT
          echo "linux=$(sha $A/structurizrx-x86_64-unknown-linux-gnu/structurizrx-x86_64-unknown-linux-gnu.tar.gz)" >> $GITHUB_OUTPUT
          echo "linux_arm=$(sha $A/structurizrx-aarch64-unknown-linux-gnu/structurizrx-aarch64-unknown-linux-gnu.tar.gz)" >> $GITHUB_OUTPUT
          echo "win=$(sha $A/structurizrx-x86_64-pc-windows-msvc/structurizrx-x86_64-pc-windows-msvc.zip)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/structurizrx-aarch64-apple-darwin/structurizrx-aarch64-apple-darwin.tar.gz
            artifacts/structurizrx-x86_64-apple-darwin/structurizrx-x86_64-apple-darwin.tar.gz
            artifacts/structurizrx-x86_64-unknown-linux-gnu/structurizrx-x86_64-unknown-linux-gnu.tar.gz
            artifacts/structurizrx-x86_64-unknown-linux-musl/structurizrx-x86_64-unknown-linux-musl.tar.gz
            artifacts/structurizrx-aarch64-unknown-linux-gnu/structurizrx-aarch64-unknown-linux-gnu.tar.gz
            artifacts/structurizrx-x86_64-pc-windows-msvc/structurizrx-x86_64-pc-windows-msvc.zip
            artifacts/*-linux-packages/*.deb
            artifacts/*-linux-packages/*.rpm

      - name: Update Homebrew formula
        run: |
          VERSION="${{ github.ref_name }}"
          BARE_VERSION="${VERSION#v}"
          REPO="${{ github.repository }}"
          SHA_ARM="${{ steps.checksums.outputs.arm }}"
          SHA_X86="${{ steps.checksums.outputs.x86 }}"
          SHA_LINUX="${{ steps.checksums.outputs.linux }}"
          SHA_LINUX_ARM="${{ steps.checksums.outputs.linux_arm }}"
          mkdir -p Formula
          cat > Formula/structurizrx.rb << EOF
          # This formula is automatically updated by the release workflow when a new tag is pushed.
          # To install, first add the tap:
          #
          #   brew tap pomali/structurizrx https://github.com/${REPO}
          #   brew install pomali/structurizrx/structurizrx
          class Structurizrx < Formula
            desc "Structurizr DSL toolchain - Rust implementation"
            homepage "https://github.com/${REPO}"
            version "${BARE_VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/${VERSION}/structurizrx-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/${REPO}/releases/download/${VERSION}/structurizrx-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/${VERSION}/structurizrx-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/${REPO}/releases/download/${VERSION}/structurizrx-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX}"
              end
            end

            def install
              bin.install "structurizrx"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/structurizrx --version")
            end
          end
          EOF

      - name: Update Scoop manifest
        run: |
          VERSION="${{ github.ref_name }}"
          BARE_VERSION="${VERSION#v}"
          REPO="${{ github.repository }}"
          SHA_WIN="${{ steps.checksums.outputs.win }}"
          mkdir -p bucket
          cat > bucket/structurizrx.json << EOF
          {
              "version": "${BARE_VERSION}",
              "description": "Structurizr DSL toolchain - Rust implementation",
              "homepage": "https://github.com/${REPO}",
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/${REPO}/releases/download/${VERSION}/structurizrx-x86_64-pc-windows-msvc.zip",
                      "hash": "${SHA_WIN}"
                  }
              },
              "bin": "structurizrx.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/${REPO}/releases/download/v\$version/structurizrx-x86_64-pc-windows-msvc.zip"
                      }
                  }
              }
          }
          EOF

      - name: Update winget manifests
        run: |
          VERSION="${{ github.ref_name }}"
          BARE_VERSION="${VERSION#v}"
          REPO="${{ github.repository }}"
          # winget convention: uppercase SHA256
          SHA_WIN=$(echo "${{ steps.checksums.outputs.win }}" | tr 'a-f' 'A-F')
          W=packaging/winget
          # Bump PackageVersion in all three manifests.
          sed -i "s/^PackageVersion: .*/PackageVersion: ${BARE_VERSION}/" \
            "$W/Pomali.StructurizrX.yaml" \
            "$W/Pomali.StructurizrX.locale.en-US.yaml" \
            "$W/Pomali.StructurizrX.installer.yaml"
          # Point the installer at this release's zip + checksum.
          sed -i "s#InstallerUrl: .*#InstallerUrl: https://github.com/${REPO}/releases/download/${VERSION}/structurizrx-x86_64-pc-windows-msvc.zip#" \
            "$W/Pomali.StructurizrX.installer.yaml"
          sed -i "s/InstallerSha256: .*/InstallerSha256: \"${SHA_WIN}\"/" \
            "$W/Pomali.StructurizrX.installer.yaml"

      - name: Update Chocolatey package
        run: |
          VERSION="${{ github.ref_name }}"
          BARE_VERSION="${VERSION#v}"
          SHA_WIN="${{ steps.checksums.outputs.win }}"
          C=packaging/chocolatey
          sed -i "s#<version>.*</version>#<version>${BARE_VERSION}</version>#" "$C/structurizrx.nuspec"
          sed -i "s/\$version *= *'[^']*'/\$version     = '${BARE_VERSION}'/" "$C/tools/chocolateyinstall.ps1"
          sed -i "s/\$checksum64 *= *'[^']*'/\$checksum64  = '${SHA_WIN}'/" "$C/tools/chocolateyinstall.ps1"

      - name: Commit and push package manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.event.repository.default_branch }}
          git checkout ${{ github.event.repository.default_branch }}
          git add Formula/structurizrx.rb bucket/structurizrx.json packaging/winget packaging/chocolatey
          git diff --cached --quiet || git commit -m "chore: update package manifests for ${{ github.ref_name }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
